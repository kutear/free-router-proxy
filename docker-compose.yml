services:
  free-router-proxy:
    build: .
    container_name: free-router-proxy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FREE_ROUTER_HOST=0.0.0.0
      - FREE_ROUTER_PORT=8787
    ports:
      - "0.0.0.0:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
